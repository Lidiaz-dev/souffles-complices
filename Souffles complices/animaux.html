<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les animaux — Souffles Complices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <a class="logo-wrap" href="index.html" aria-label="Souffles Complices, retour à l'accueil">
    <img src="assets/logo.jpg" alt="Logo Souffles Complices">
    <div class="logo-word">Souffles <span>Complices</span></div>
  </a>
  <nav class="site-nav">
    <a href="index.html">Accueil</a>
    <a href="association.html">L'association</a>
    <a href="animaux.html">Les animaux</a>
    <a href="soutenir.html">Nous soutenir</a>
  </nav>
</header>

<section class="page-hero" data-emojis="🐎 🐑 🐔 🦆">
  <div class="section-inner">
    <span class="pill">Fiches animaux</span>
    <h1>Ils vivent au refuge.</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="section-inner">
    <div class="filters" id="typeFilters"></div>

    <!-- Fiches générées automatiquement depuis content/animaux.json -->
    <div class="animal-grid" id="animalGrid"></div>
  </div>
</section>

<section id="gardiennes" class="gardiennes" hidden>
  <div class="section-inner">
    <div class="section-head">
      <span class="pill">Nos gardiennes</span>
      <h2>Les gardiennes du refuge.</h2>
      <p class="gardiennes-intro">Rencontrez les trois chiennes du refuge.</p>
    </div>
    <div class="gardiennes-grid" id="gardiennesGrid"></div>
  </div>
</section>

<footer id="contact">
  <div class="footer-inner">
    <div class="col">
      <div class="logo-wrap">
        <img src="assets/logo.jpg" alt="Logo Souffles Complices" style="height:40px;width:40px;">
        <div class="logo-word">Souffles <span>Complices</span></div>
      </div>
      <p style="margin-top:14px;">Association loi 1901</p>
      <p>Refuge équicie & ferme pédagogique</p>
    </div>
    <div class="col" id="footerContact"></div>
  </div>
</footer>

<script src="js/site.js"></script>
<script>
  const STATUT_LABEL = { resident: "Résident", soins: "En soins", parrainable: "Parrainable", gardienne: "Gardienne" };
  let ANIMAUX = [];
  let PARRAINAGE_LIEN_DEFAUT = HELLOASSO_FALLBACK;

  function renderAnimaux(list) {
    const grid = document.getElementById('animalGrid');
    if (!list.length) {
      grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;'>Aucun animal ne correspond à ces filtres.</p>";
      return;
    }
    grid.innerHTML = list.map((a, i) => {
      const parrainageLien = lienOuDefaut(a.lien_parrainage, PARRAINAGE_LIEN_DEFAUT);
      const parrainageBtn = (a.statut === 'parrainable' && parrainageLien && !a.sans_parrainage)
        ? `<a class="btn btn-primary btn-parrain" href="${parrainageLien}" target="_blank" rel="noopener">Parrainer ${a.nom}</a>`
        : '';
      return `
      <article class="kcard ${a.statut}" data-status="${a.statut}" style="--i:${Math.min(i, 9)}">
        <div class="bulle-wrap">
          <div class="blob-photo">
            ${a.photo ? `<img src="${a.photo}" alt="Photo de ${a.nom}"${styleCadrage(a.photo_position)}>` : `<span class="placeholder">Photo à venir</span>`}
          </div>
        </div>
        <div class="status-pill">${STATUT_LABEL[a.statut] || a.statut}</div>
        <h3 class="hand"><a class="card-link" href="animal.html?id=${encodeURIComponent(a.numero)}">${a.nom}</a></h3>
        <div class="meta">${[a.espece, calculerAge(a.naissance)].filter(Boolean).join(' · ')}</div>
        <p class="story">${a.resume || a.histoire || ''}</p>
        ${parrainageBtn}
        <span class="more-link">Voir la fiche →</span>
      </article>
    `;
    }).join('');
  }

  helloassoPromise
    .then(lien => { PARRAINAGE_LIEN_DEFAUT = lien; })
    .then(() => fetchJSON('content/animaux.json'))
    .then(data => {
      ANIMAUX = data.animaux || [];
      renderTypeFilters();
      appliquerFiltres();
      renderGardiennes();
    })
    .catch(() => {
      document.getElementById('animalGrid').innerHTML = "<p>Impossible de charger les fiches animaux pour le moment.</p>";
    });

  const TYPE_LABEL = { cheval: "Chevaux", poney: "Poneys", ane: "Ânes", mouton: "Moutons", poule: "Poules", canard: "Canards", chien: "Chiens" };
  const filtres = { type: 'all' };

  function appliquerFiltres() {
    // Les chiennes ont leur propre encart en bas de page : elles n'apparaissent dans la liste qu'avec le filtre « Chiens ».
    renderAnimaux(ANIMAUX.filter(a => filtres.type === 'all' ? a.type !== 'chien' : a.type === filtres.type));
  }

  function renderGardiennes() {
    const chiens = ANIMAUX.filter(a => a.type === 'chien');
    const section = document.getElementById('gardiennes');
    section.hidden = !chiens.length;
    document.getElementById('gardiennesGrid').innerHTML = chiens.map((a, i) => `
      <a class="gardienne" href="animal.html?id=${encodeURIComponent(a.numero)}" style="--i:${i}">
        <div class="bulle-gardienne">
          ${a.photo ? `<img src="${a.photo}" alt="Photo de ${a.nom}"${styleCadrage(a.photo_position)}>` : `<span class="emoji-bulle" aria-hidden="true">🐕</span>`}
        </div>
        <span class="nom hand">${a.nom}</span>
        <span class="more-link">Voir la fiche →</span>
      </a>`).join('');
  }

  function bindFilters(container, key) {
    container.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtres[key] = btn.dataset.filter;
        appliquerFiltres();
      });
    });
  }

  function renderTypeFilters() {
    const presents = Object.keys(TYPE_LABEL).filter(t => ANIMAUX.some(a => a.type === t));
    const container = document.getElementById('typeFilters');
    container.innerHTML = presents.length < 2 ? '' :
      `<button class="filter-btn active" data-filter="all"><span class="emo">🐾</span><span>Tous</span></button>` +
      presents.map(t => `<button class="filter-btn" data-filter="${t}"><span class="emo">${emojiPourType(t)}</span><span>${TYPE_LABEL[t]}</span></button>`).join('');
    bindFilters(container, 'type');
  }

</script>

</body>
</html>

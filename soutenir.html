<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous soutenir — Souffles Complices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <a class="logo-wrap" href="index.html" aria-label="Souffles Complices, retour à l'accueil">
    <img src="assets/logo.jpg" alt="Logo Souffles Complices">
    <div class="logo-word">Souffles <span>Complices</span></div>
  </a>
  <nav class="site-nav">
    <a href="index.html">Accueil</a>
    <a href="association.html">L'association</a>
    <a href="equicie.html">Équicie</a>
    <a href="animaux.html">Les animaux</a>
    <a href="soutenir.html">Nous soutenir</a>
  </nav>
</header>

<section class="page-hero" data-emojis="🐑 🐴 🦆 🐔">
  <div class="section-inner">
    <span class="pill">Nous soutenir</span>
    <h1>Aidez le refuge dès aujourd'hui.</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="section-inner">
    <div class="support-grid" id="soutenirGrid"></div>
    <div class="helloasso-note hand" id="soutenirNote" style="font-size:1.1rem;"></div>
  </div>
</section>

<section id="adherer" style="background:var(--teal-wash);">
  <div class="section-inner">
    <div class="section-head">
      <span class="pill">Adhésion</span>
      <h2>Modalités d'adhésion.</h2>
    </div>
    <div id="adhererContent"></div>
  </div>
</section>

<footer id="contact">
  <div class="footer-inner">
    <div class="col col-marque">
      <a class="footer-logo" href="index.html" aria-label="Souffles Complices, retour à l'accueil"><img src="assets/logo.jpg" alt="Logo Souffles Complices"></a>
      <div class="marque-texte">
        <div class="logo-word">Souffles <span>Complices</span></div>
        <p>Association loi 1901</p>
        <p>Refuge équicie &amp; ferme pédagogique</p>
      </div>
    </div>
    <div class="col col-contact" id="footerContact"></div>
  </div>
</footer>

<script src="js/site.js"></script>
<script>
  const EMOJI_TUILE = { don: '🩺', parrainage: '🐴', adhesion: '🤝' };

  Promise.all([fetchJSON('content/soutien.json'), fetchJSON('content/adhesion.json'), helloassoPromise]).then(([soutien, adh, helloasso]) => {
    // --- Les trois tuiles : don, parrainage, adhésion (mêmes tailles, boutons alignés)
    const tuiles = [
      { cle: 'don', helloasso: true },
      { cle: 'parrainage', helloasso: false },
      { cle: 'adhesion', helloasso: true }
    ];
    document.getElementById('soutenirGrid').innerHTML = tuiles.map(t => {
      const c = soutien[t.cle];
      if (!c) return '';
      const lien = t.helloasso
        ? lienOuDefaut(t.cle === 'adhesion' ? (c.lien || adh.lien) : c.lien, helloasso)
        : (String(c.lien || '').trim() || 'animaux.html');
      const attrs = estLienExterne(lien) ? ' target="_blank" rel="noopener"' : '';
      const masque = t.helloasso ? ' data-masque-sticky' : '';
      const classeBouton = t.cle === 'parrainage' ? 'btn btn-or' : 'btn btn-primary';
      const visuel = c.image
        ? `<img ${attrsImage(c.image)} alt=""${styleCadrage(c.image_position)}>`
        : `<span class="emoji-bulle" aria-hidden="true">${EMOJI_TUILE[t.cle] || '🐾'}</span>`;
      return `
        <div class="support-card">
          <div class="bulle-tuile">${visuel}</div>
          <h3>${c.titre}</h3>
          <p>${c.texte}</p>
          <a class="${classeBouton}" href="${lien}"${attrs}${masque}>${c.bouton}</a>
        </div>`;
    }).join('');
    const note = document.getElementById('soutenirNote');
    note.textContent = soutien.note || '';
    note.hidden = !soutien.note;

    // --- Encart des modalités d'adhésion
    const lienAdhesion = lienOuDefaut(adh.lien, helloasso);
    const liste = (items, balise, classe) => (items || []).length
      ? `<${balise} class="${classe}">${items.map(x => `<li>${x}</li>`).join('')}</${balise}>` : '';
    document.getElementById('adhererContent').innerHTML = `
      <div class="encart-adhesion">
        <div class="encart-prix">
          <span class="lib">Cotisation annuelle</span>
          <span class="montant">${adh.cotisation || ''}</span>
          <span class="periode">${adh.periode || ''}</span>
        </div>
        <div class="encart-corps">
          <h3>Comment adhérer</h3>
          ${adh.intro ? `<p class="intro">${adh.intro}</p>` : ''}
          ${liste(adh.etapes, 'ol', 'etapes')}
          ${(adh.avantages || []).length ? `<h4>Ce que permet votre adhésion</h4>${liste(adh.avantages, 'ul', 'avantages')}` : ''}
          ${adh.precisions ? `<p class="precisions">${adh.precisions}</p>` : ''}
          <a class="btn btn-primary btn-adherer" href="${lienAdhesion}" target="_blank" rel="noopener" data-masque-sticky><span class="label">${adh.bouton}</span><span class="arrow" aria-hidden="true">→</span></a>
        </div>
      </div>`;
  }).catch(() => {
    document.getElementById('soutenirGrid').innerHTML = "<p>Impossible de charger cette page pour le moment.</p>";
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche animal — Souffles Complices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="logo-wrap">
    <img src="assets/logo.jpg" alt="Logo Souffles Complices">
    <div class="logo-word">Souffles <span>Complices</span></div>
  </div>
  <nav class="site-nav">
    <a href="index.html">Accueil</a>
    <a href="association.html">L'association</a>
    <a href="animaux.html">Les animaux</a>
    <a href="soutenir.html">Nous soutenir</a>
  </nav>
</header>

<section>
  <div class="section-inner">
    <a class="back-link" href="animaux.html">← Tous les animaux</a>
    <div id="fiche"><p>Chargement...</p></div>
  </div>
</section>

<footer id="contact">
  <div class="footer-inner">
    <div class="col">
      <div class="logo-wrap">
        <img src="assets/logo.jpg" alt="Logo Souffles Complices" style="height:40px;width:40px;">
        <div class="logo-word">Souffles <span>Complices</span></div>
      </div>
      <p style="margin-top:14px;">Association loi 1901</p>
      <p>Refuge équicie & ferme pédagogique</p>
    </div>
    <div class="col" id="footerContact"></div>
  </div>
</footer>

<script src="js/site.js"></script>
<script>
  const STATUT_LABEL = { resident: "Résident", soins: "En soins", parrainable: "Parrainable" };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fact(label, value) {
    return value ? `<div><dt>${label}</dt><dd>${esc(value)}</dd></div>` : '';
  }

  function paragraphs(text) {
    return String(text || '').split(/\n\s*\n|\n/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join('');
  }

  const ROTATIONS = [-3, 2.5, -1.5, 3, -2.5, 1.5];

  // Accepte une liste de liens (ancien format) ou d'objets { image, legende }.
  function normaliserGalerie(g) {
    return (g || []).map(x => typeof x === 'string' ? { image: x, legende: '' } : x).filter(x => x && x.image);
  }

  function initGalerie(items, nom) {
    if (!items.length) return;
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.hidden = true;
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.setAttribute('aria-label', 'Photos de ' + nom);
    lb.innerHTML = `
      <button type="button" class="lb-btn lb-close" aria-label="Fermer"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      ${items.length > 1 ? '<button type="button" class="lb-btn lb-prev" aria-label="Photo précédente"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 5l-7 7 7 7"/></svg></button><button type="button" class="lb-btn lb-next" aria-label="Photo suivante"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 5l7 7-7 7"/></svg></button>' : ''}
      <figure><img alt=""><figcaption></figcaption></figure>
      <div class="lb-count"></div>`;
    document.body.appendChild(lb);
    const img = lb.querySelector('img'), cap = lb.querySelector('figcaption'), count = lb.querySelector('.lb-count');
    let courant = 0, ouvreur = null;

    function afficher(n) {
      courant = (n + items.length) % items.length;
      img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
      img.src = items[courant].image;
      img.alt = items[courant].legende || 'Photo de ' + nom;
      cap.textContent = items[courant].legende || '';
      count.textContent = items.length > 1 ? `${courant + 1} / ${items.length}` : '';
    }
    function ouvrir(n, bouton) {
      ouvreur = bouton;
      afficher(n);
      lb.hidden = false;
      document.body.style.overflow = 'hidden';
      lb.querySelector('.lb-close').focus();
    }
    function fermer() {
      lb.hidden = true;
      document.body.style.overflow = '';
      if (ouvreur) ouvreur.focus();
    }

    document.querySelectorAll('.polaroid').forEach(b => b.addEventListener('click', () => ouvrir(+b.dataset.i, b)));
    lb.querySelector('.lb-close').addEventListener('click', fermer);
    const prev = lb.querySelector('.lb-prev'), next = lb.querySelector('.lb-next');
    if (prev) { prev.addEventListener('click', () => afficher(courant - 1)); next.addEventListener('click', () => afficher(courant + 1)); }
    lb.addEventListener('click', e => { if (e.target === lb) fermer(); });
    document.addEventListener('keydown', e => {
      if (lb.hidden) return;
      if (e.key === 'Escape') fermer();
      else if (e.key === 'ArrowLeft') afficher(courant - 1);
      else if (e.key === 'ArrowRight') afficher(courant + 1);
    });
    let departX = null;
    lb.addEventListener('touchstart', e => { departX = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', e => {
      if (departX === null) return;
      const dx = e.changedTouches[0].clientX - departX;
      if (Math.abs(dx) > 50) afficher(courant + (dx < 0 ? 1 : -1));
      departX = null;
    });
  }

  function renderFiche(a, parrainageDefaut) {
    document.title = `${a.nom} — Souffles Complices`;
    const lien = lienOuDefaut(a.lien_parrainage, parrainageDefaut);
    const parrainBtn = (a.statut === 'parrainable' && lien)
      ? `<p><a class="btn btn-primary" href="${esc(lien)}" target="_blank" rel="noopener">Parrainer ${esc(a.nom)}</a></p>` : '';
    const galerie = normaliserGalerie(a.galerie);
    document.getElementById('fiche').innerHTML = `
      <div class="fiche">
        <div class="blob-photo">
          ${a.photo ? `<img src="${esc(a.photo)}" alt="Photo de ${esc(a.nom)}"${styleCadrage(a.photo_position)}>` : `<span>Photo à venir</span>`}
        </div>
        <div>
          <span class="status-pill ${esc(a.statut)}">${esc(STATUT_LABEL[a.statut] || a.statut)}</span>
          <h1>${esc(a.nom)}</h1>
          <dl class="fiche-facts">
            ${fact('Espèce', a.espece)}${fact('Âge', calculerAge(a.naissance))}            ${fact('Arrivée au refuge', a.arrivee)}${fact('Caractère', a.caractere)}
          </dl>
          <div class="fiche-text">
            ${paragraphs(a.histoire || a.resume)}
          </div>
          ${parrainBtn}
        </div>
      </div>
      ${galerie.length ? `
        <section class="polaroids">
          <h2>Ses photos</h2>
          <div class="polaroid-grid">
            ${galerie.map((g, i) => `
              <button type="button" class="polaroid" style="--rot:${ROTATIONS[i % ROTATIONS.length]}" data-i="${i}" aria-label="Agrandir la photo ${i + 1}${g.legende ? ' : ' + esc(g.legende) : ''}">
                <span class="cadre"><img src="${esc(g.image)}" alt="${esc(g.legende || 'Photo de ' + a.nom)}" loading="lazy"></span>
                <span class="legende">${esc(g.legende)}</span>
              </button>`).join('')}
          </div>
        </section>` : ''}
    `;
    initGalerie(galerie, a.nom);
  }

  const id = new URLSearchParams(location.search).get('id');
  Promise.all([fetchJSON('content/animaux.json'), helloassoPromise]).then(([data, helloasso]) => {
    const a = (data.animaux || []).find(x => String(x.numero) === id);
    if (!a) {
      document.getElementById('fiche').innerHTML = "<p>Cet animal est introuvable. <a href='animaux.html'>Voir tous les animaux</a></p>";
      return;
    }
    renderFiche(a, helloasso);
  }).catch(() => {
    document.getElementById('fiche').innerHTML = "<p>Impossible de charger la fiche pour le moment.</p>";
  });
</script>

</body>
</html>
